name: Build MAX Control Android APK

on:
  workflow_dispatch:
  push:
    branches: [main, master, build-max-control-apk]
    paths:
      - "max-control-android/**"
      - ".github/workflows/build-max-control-apk.yml"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
      - name: Install Android platform
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"
      - name: Build debug APK
        working-directory: max-control-android
        run: gradle --no-daemon assembleDebug
      - name: Upload installable APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: MAX-Control-Porucheniy-APK
          path: max-control-android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
      - name: Publish APK download release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: max-control-porucheniy-v0.1.0-build1
          name: MAX Контроль поручений Android v0.1.0
          body: |
            Установочный APK для Android. Приложение является клиентом сервера MAX Контроль поручений; для реального мониторинга MAX требуется отдельно настроенный сервер и бот.
          files: max-control-android/app/build/outputs/apk/debug/app-debug.apk
          fail_on_unmatched_files: true
