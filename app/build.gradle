plugins { id 'com.android.application' }
android { namespace 'ru.samara.mailreport'; compileSdk 35
    defaultConfig { applicationId 'ru.samara.mailreport'; minSdk 26; targetSdk 35; versionCode 1; versionName '1.0' }
    packaging { resources { excludes += ['META-INF/LICENSE.md', 'META-INF/LICENSE', 'META-INF/NOTICE.md', 'META-INF/NOTICE'] } }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
}
dependencies {
    implementation 'com.sun.mail:android-mail:1.6.7'
    implementation 'com.sun.mail:android-activation:1.6.7'
}
