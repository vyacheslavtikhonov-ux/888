plugins {
    id 'com.android.application'
}

android {
    namespace 'ru.maxcontrol.app'
    compileSdk 35

    defaultConfig {
        applicationId 'ru.maxcontrol.app'
        minSdk 24
        targetSdk 35
        versionCode 1
        versionName '0.1.0'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
